name: ESP8266 firmware compile
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  build-esp8266:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP8266 core 3.1.2
        run: |
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266@3.1.2 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
      - name: Compile for original ESP12E / ESP8266
        run: |
          arduino-cli compile             --fqbn "esp8266:esp8266:generic"             --libraries "$GITHUB_WORKSPACE/libraries"             --warnings default             firmware/a-microReader-v1.2
